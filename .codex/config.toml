# Keep command writes limited to this repository while allowing authenticated
# developer tools such as GitHub CLI to reach their remote services.
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

# Orchestrator default
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
# service_tier = "fast"

# Defaults used by every spawned sub-agent
[agents]
enabled = true
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "low"

# Optional concurrency limit
max_concurrent_threads_per_session = 6

[features]
hooks = true

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$HOME/.codex/hooks/shunt_read.py"'
timeout = 3
statusMessage = "Routing large reads"